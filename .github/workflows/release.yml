name: Release

# Pushing a version tag (v0.3.0) builds the installers on Windows, macOS and
# Linux, smoke-tests each packaged app, attaches everything to a draft release
# and publishes it once every platform passed. Installed copies of Graft read
# these releases and offer the update with a "Restart to update" prompt.
#
# Running the workflow by hand (Actions → Release → Run workflow) is a dry run:
# the same builds and checks, with the installers kept as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. Only the jobs that create, fill or publish the release get to write,
# and none of them leaves its token on disk for the build's dependencies to find.
permissions:
  contents: read

jobs:
  validate:
    name: Validate before packaging
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e

  draft:
    name: Draft the release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Create the draft with the notes from What's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then exit 0; fi
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Graft ${GITHUB_REF_NAME#v}" --notes-file notes.md

  build:
    name: Build on ${{ matrix.os }}
    needs: [draft, validate]
    if: ${{ !cancelled() && needs.draft.result != 'failure' && needs.validate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
            app: dist/win-unpacked/Graft.exe
          - os: macos-latest
            platform: --mac
            app: dist/mac-arm64/Graft.app/Contents/MacOS/Graft
          - os: ubuntu-latest
            platform: --linux
            app: dist/linux-unpacked/graft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.platform }} --publish never
      - name: Smoke-test the packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npx playwright test packaged; else npx playwright test packaged; fi
        env:
          GRAFT_PACKAGED_EXE: ${{ matrix.app }}
      # What is published can be checked by hand: every installer carries the version being released,
      # and its SHA-256 goes into the release beside it.
      - name: Check the installers' names and write their checksums
        shell: bash
        run: |
          shopt -s nullglob
          version="$(node -p "require('./package.json').version")"
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb)
          if [ "${#files[@]}" -eq 0 ]; then echo "No installer was built." >&2; exit 1; fi
          for file in "${files[@]}"; do
            case "$file" in
              *"$version"*) ;;
              *) echo "$file does not carry version $version." >&2; exit 1 ;;
            esac
          done
          sums="dist/SHA256SUMS-${RUNNER_OS}.txt"
          for file in "${files[@]}"; do
            if command -v sha256sum > /dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi
          done | sed -E 's#^([0-9a-f]{64}) [ *]dist/#\1  #' > "$sums"
          cat "$sums"
      - name: Attach the installers to the draft
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest*.yml dist/SHA256SUMS-*.txt)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
      - name: Keep the installers (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graft-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
          retention-days: 7
      - name: Keep traces and screenshots of failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-results-${{ runner.os }}
          path: test-results/
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
